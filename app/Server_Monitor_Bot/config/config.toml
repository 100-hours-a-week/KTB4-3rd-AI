# 모니터 설정. 스테이지·시크릿은 env(APP_STAGE, AI_DB_URL …), 나머지는 여기서 고친다.

[stages.local]
enabled = true
drill = true
features = { F1 = true, F2 = true, F3 = true, F4 = true, F5 = true, F6 = true, F7 = true, F8 = true, F9 = true }

[stages.dev]
enabled = true
drill = true
features = { F1 = true, F2 = true, F3 = true, F4 = true, F5 = true, F6 = true, F7 = true, F8 = true, F9 = true }

[stages.prod]
enabled = true
drill = false
features = { F1 = true, F2 = true, F3 = true, F4 = true, F5 = true, F6 = true, F7 = true, F8 = false, F9 = true }

[telegram]
owner_ids = []
drill_operator_ids = []
chat_id = 0
poll_timeout_s = 30

[budget]
daily_tokens = 300000
drill_daily_tokens = 1500000
run_tokens = 30000
run_ms = 120000
single_tokens = 6000
rag_tokens = 8000
judge_tokens = 1000
reserve_tokens = 5000
reserve_ms = 25000

[model]
chat = "gpt-6-luna"
embedding = "text-embedding-3-small"
embedding_dim = 1536
timeout_s = 30

[detect]
interval_s = 60
window_s = 300
min_sample = 20
quiet_s = 600
recent_incident_s = 3600

[agent]
diagnose_rounds = 6
chat_rounds = 4
diagnose_retries = 2
chat_retries = 1
knowledge_retries = 2
propose_retries = 1
history_turns = 20
search_top_k = 5
search_min_score = 0.35
draft_ttl_h = 24
observe_after_s = 600
chain_depth = 3

[retention]
raw_days = 30
metrics_days = 365
alerts_days = 7
runs_days = 90
tg_days = 30
chat_days = 365
drafts_days = 30
events_days = 7

[buffer]
max_mb = 50
flags_ttl_s = 3

[policy."llm.max_concurrency"]
min = 1
max = 8
default = 0
max_ttl_min = 60
prod_ok = true

[policy."image.max_side_px"]
min = 1024
max = 2048
default = 0
max_ttl_min = 120
prod_ok = false

[policy."route.force_luna"]
min = 1
max = 1
default = 0
max_ttl_min = 30
prod_ok = true

[policy."modal.wait_s"]
min = 10
max = 30
default = 15
max_ttl_min = 60
prod_ok = true
