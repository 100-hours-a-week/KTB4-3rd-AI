[project]
name = "backend-fastapi"
version = "0.1.0"
requires-python = ">=3.10"
# v2(luna만)는 기본 의존성만 있으면 된다.
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "httpx>=0.28",
    "pillow>=12",
    # 로컬 Qdrant(QdrantClient(path=...)). 서버로 옮기면 url=만 바꾼다.
    "qdrant-client>=1.19",
    # Cloud Prometheus가 수집하는 /metrics(요청량, 에러율, 지연).
    "prometheus-fastapi-instrumentator>=8.1",
    # Modal T4 호출·자동 배포(MODAL_TOKEN_ID_1, MODAL_TOKEN_SECRET_1). env만 넣으면 켜지도록 기본에 둔다.
    # 실행할 때만 불러오므로 키가 없으면 비용이 없다. GPU 쪽 패키지는 llm/modal_app.py 이미지에 있다.
    "modal>=1.0",
]

[project.optional-dependencies]
# 이 서버에서 OCR과 openjev를 돌릴 때(LOCAL_DEVICE=TRUE). GPU 서버는 paddlepaddle-gpu로 바꾼다.
local = [
    "paddleocr>=3.7",
    "paddlepaddle>=3.0",
    "torch>=2.13",
    "transformers>=5.16",
]
